services:
  app:
    ports: !reset []
    environment: &env
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: backup_panel
      DB_USERNAME: backup
      DB_PASSWORD: ${DB_PASSWORD}
      PHP_CLI_SERVER_WORKERS: 4
    restart: unless-stopped
    depends_on: !reset []
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - .:/var/www/html
      - ./opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
  queue:
    environment: *env
    depends_on: !reset []
    extra_hosts: ["host.docker.internal:host-gateway"]
  scheduler:
    environment: *env
    depends_on: !reset []
    extra_hosts: ["host.docker.internal:host-gateway"]
  db:
    profiles: ["disabled"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PANEL_HOST: ${PANEL_HOST:?задайте PANEL_HOST в .env.compose (IP или домен панели)}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  caddy-data:
